<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--n:#0E1B3D;--w:#F4F1EA;--r:#E03C31;--b:#5B8DEF;--a:#F2A900;--mut:#B8BFD3}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;background:var(--n);font:15px/1.45 'Hanken Grotesk',sans-serif;color:var(--w)}
header{height:56px;border-bottom:1px solid #24345F;display:flex;align-items:center;padding:0 28px;gap:24px}
.sp{flex:1}.btn{background:var(--w);color:var(--n);padding:7px 14px;border-radius:20px;font-weight:600}
main{display:grid;grid-template-columns:320px 1fr;height:844px}
aside{border-right:1px solid #24345F;padding:22px 24px}
aside h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #24345F}.row b{font-variant-numeric:tabular-nums}
section{padding:28px 36px}
h1{font-size:34px;font-weight:800;line-height:1.15}h1 em{font-style:normal;color:var(--a)}
.sub{color:var(--mut);margin-top:6px}
svg{margin-top:20px}
</style></head><body>
<header><b>Feature Cost</b><span class="sp"></span><span>How it works</span><span class="btn">Copy link</span></header>
<main><aside>
<h3>Scenario (example)</h3><div class="row"><span>Team</span><b>1 Jr · 2 Mid · 1 Sr</b></div><div class="row"><span>Feature</span><b>40 pts</b></div><div class="row"><span>Apps</span><b>3</b></div><div class="row"><span>Horizon</span><b>5 years</b></div>
</aside><section>
<h1>Duplicating costs <em>+83 400 €</em> by year 5.<br>Lines cross at 14 months.</h1><p class="sub">Each station is a cost you pay along the way.</p>
<svg width="1000" height="560" font-family="Hanken Grotesk">
<path d="M40 280 L260 280 L320 220 L960 220" stroke="#5B8DEF" stroke-width="12" fill="none" stroke-linejoin="round"/>
<path d="M40 300 L200 300 L260 280 L320 340 L960 340" stroke="#E03C31" stroke-width="12" fill="none" stroke-linejoin="round"/>
<circle cx="260" cy="282" r="20" fill="#F4F1EA" stroke="#0E1B3D" stroke-width="4"/><text x="226" y="250" fill="#F2A900" font-weight="800" font-size="15">14 mo · break-even</text>
<g fill="#F4F1EA" font-size="14"><circle cx="480" cy="220" r="8"/><text x="450" y="200">Maint. Y2</text><circle cx="720" cy="220" r="8"/><text x="690" y="200">Maint. Y4</text>
<circle cx="440" cy="340" r="8"/><text x="400" y="372">Bug fixes ×3</text><circle cx="640" cy="340" r="8"/><text x="600" y="372">Sync copies</text><circle cx="840" cy="340" r="8"/><text x="800" y="372">Drift +20 %</text></g>
<text x="970" y="226" fill="#5B8DEF" font-weight="800" font-size="18">148 k€</text><text x="970" y="346" fill="#E03C31" font-weight="800" font-size="18">231 k€</text>
</svg></section></main></body></html>
